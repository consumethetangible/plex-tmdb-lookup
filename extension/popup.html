<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>TMDB ID Lookup</title>
		<link rel="stylesheet" href="shared/styles.css" />
		<link rel="stylesheet" href="popup.css" />
	</head>
	<body class="popup">
		<header class="top">
			<h1>TMDB ID Lookup</h1>
			<button id="settings" type="button" class="icon-button" title="Settings" aria-label="Settings">⚙</button>
		</header>

		<main>
			<form id="search-form" role="search" autocomplete="off">
				<input id="q" type="search" placeholder="Movie, show, person, or a TMDB ID" aria-label="Search TMDB" />
				<button type="submit" class="primary">Search</button>
			</form>

			<div class="chips" role="group" aria-label="Filter results">
				<button type="button" class="chip active" data-filter="all" aria-pressed="true">All</button>
				<button type="button" class="chip" data-filter="movies" aria-pressed="false">Movies</button>
				<button type="button" class="chip" data-filter="tv" aria-pressed="false">TV</button>
				<button type="button" class="chip" data-filter="collections" aria-pressed="false">Collections</button>
				<button type="button" class="chip" data-filter="people" aria-pressed="false">People</button>
			</div>

			<div id="setup" class="notice" hidden>
				<h2>One-time setup</h2>
				<p>Add your TMDB <strong>API Read Access Token</strong> in settings, then reopen this popup.</p>
				<button id="open-settings" type="button" class="primary">Open settings</button>
			</div>

			<div id="status" class="status" role="status" aria-live="polite" hidden></div>
			<div id="results"></div>
			<button id="load-more" type="button" class="more" hidden>Load more</button>
		</main>

		<footer>
			<p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
		</footer>

		<script type="module" src="popup.js"></script>
	</body>
</html>
